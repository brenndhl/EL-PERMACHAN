<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --negro:#141110; --crema:#f3ead6; --madera:#a8774a; --madera2:#7a5232; --ok:#1e6b3a; --err:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f5f1ea; color:#1d1a17; font-size:16px; padding-bottom:20px; }
  header { background:var(--negro); color:var(--crema); padding:14px 16px; display:flex; align-items:center; gap:14px; }
  header img { width:62px; height:62px; border-radius:50%; flex:none; box-shadow:0 0 0 2px var(--madera); }
  header h1 { margin:0; font-size:21px; }
  header p { margin:3px 0 0; font-size:13px; opacity:.8; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  h2 { font-size:18px; margin:0 0 10px; }
  label { display:block; font-weight:600; font-size:14px; margin:12px 0 4px; }
  input { width:100%; padding:13px; font-size:17px; border:1px solid #cfc6b8; border-radius:10px; }
  input:focus { outline:2px solid var(--madera); border-color:var(--madera); }
  button { width:100%; padding:14px; font-size:16px; font-weight:700; border:0; border-radius:12px; background:var(--negro); color:var(--crema); margin-top:14px; cursor:pointer; }
  button.sec { background:#efe6d6; color:var(--madera2); }
  button.link { background:none; color:var(--madera2); text-decoration:underline; font-weight:500; padding:8px 0; }
  button:disabled { opacity:.6; }
  .msg { padding:12px; border-radius:10px; margin-top:12px; font-size:14px; }
  .msg.err { background:#fde8e7; color:var(--err); } .msg.ok { background:#e5f4ea; color:var(--ok); }
  .nota { font-size:14px; color:#6b625a; }
  .oculto { display:none; }
  .hola { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .hola b { font-size:17px; }
  .f { border-left:5px solid #d8cfc0; }
  .f.Pendiente, .f.Emitida { border-left-color:#e0a800; } .f.Enviada { border-left-color:var(--ok); } .f.Rechazada { border-left-color:var(--err); }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .tk { font-weight:700; font-size:17px; }
  .meta { font-size:13px; color:#6b625a; margin-top:3px; }
  .chip { flex:none; font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; }
  .c-Pendiente, .c-Emitida { background:#fff2cc; color:#7a5b00; } .c-Enviada { background:#d9ead3; color:var(--ok); } .c-Rechazada { background:#f4cccc; color:#8a1c14; }
  .acc { display:flex; gap:8px; margin-top:10px; } .acc button { margin-top:0; padding:11px 8px; font-size:15px; }
  .resumen { display:flex; gap:8px; margin-bottom:12px; }
  .resumen div { flex:1; background:#fff; border-radius:12px; padding:10px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .resumen b { display:block; font-size:24px; } .resumen span { font-size:12px; color:#6b625a; }
  .vacio { text-align:center; padding:26px 10px; color:#6b625a; }
  input.codigo { font-size:26px; letter-spacing:8px; text-align:center; }
</style>
</head>
<body>
<header>
  <img src="https://brenndhl.github.io/EL-PERMACHAN/logo-256.png" alt="El Permachan">
  <div><h1>Mis facturas</h1><p>Restaurante El Permachan</p></div>
</header>
<main>
  <section id="p-rfc" class="card oculto">
    <h2>Entra con tu RFC</h2>
    <p class="nota">Aquí ves todas las facturas que has pedido, en qué estado están, y puedes descargar el PDF y el XML cuando quieras.</p>
    <label for="rfc">RFC</label>
    <input id="rfc" autocomplete="off" autocapitalize="characters" maxlength="20" placeholder="Ej. XAXX010101000">
    <button id="b-rfc">Enviarme un código</button>
    <p class="nota">Te mandamos un código de 6 cifras al correo que registraste al pedir tu factura.</p>
    <div id="m-rfc"></div>
  </section>

  <section id="p-codigo" class="card oculto">
    <h2>Escribe el código</h2>
    <p class="nota" id="t-codigo"></p>
    <input id="codigo" class="codigo" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
    <button id="b-codigo">Entrar</button>
    <button class="link" id="b-otro">Usar otro RFC</button>
    <div id="m-codigo"></div>
  </section>

  <section id="p-lista" class="oculto">
    <div class="card hola"><div><span class="nota">Hola</span><br><b id="nombre"></b><div class="meta" id="rfc-vista"></div></div>
      <button class="sec" id="b-salir" style="width:auto;margin:0;padding:10px 14px">Salir</button></div>
    <div class="resumen" id="resumen"></div>
    <div id="lista"></div>
  </section>
</main>
<script>
  var TOKEN = '', RFC = '';
  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function guardar(t) { try { if (t) localStorage.setItem('ep_mf', t); else localStorage.removeItem('ep_mf'); } catch (e) {} }
  function leer() { try { return localStorage.getItem('ep_mf') || ''; } catch (e) { return ''; } }
  function ver(id) { ['p-rfc', 'p-codigo', 'p-lista'].forEach(function (x) { $(x).classList.toggle('oculto', x !== id); }); window.scrollTo(0, 0); }
  function msg(id, t, ok) { $(id).innerHTML = t ? '<div class="msg ' + (ok ? 'ok' : 'err') + '">' + esc(t) + '</div>' : ''; }
  function llamar(fn, args, ok, fail, btn) {
    var t = btn && btn.textContent; if (btn) { btn.disabled = true; btn.textContent = 'Un momento…'; }
    var r = google.script.run.withSuccessHandler(function (res) { if (btn) { btn.disabled = false; btn.textContent = t; }
      if (res && res.ok === false) { if (res.sesion === false) { guardar(''); TOKEN = ''; ver('p-rfc'); } fail(res.error); } else ok(res); })
      .withFailureHandler(function (e) { if (btn) { btn.disabled = false; btn.textContent = t; } fail('No hay conexión o hubo un problema. Inténtalo de nuevo.'); });
    r[fn].apply(r, args);
  }

  $('b-rfc').onclick = function () {
    RFC = $('rfc').value.trim().toUpperCase(); msg('m-rfc', '');
    if (RFC.length < 12) return msg('m-rfc', 'Escribe tu RFC completo (12 o 13 caracteres).');
    llamar('clientePedirCodigo', [RFC], function (r) {
      $('t-codigo').textContent = 'Te lo enviamos a ' + r.email + '. Revisa también la carpeta de spam.';
      $('codigo').value = ''; msg('m-codigo', ''); ver('p-codigo'); $('codigo').focus();
    }, function (e) { msg('m-rfc', e); }, this);
  };
  $('b-codigo').onclick = function () {
    llamar('clienteEntrar', [RFC, $('codigo').value.trim()], function (r) { TOKEN = r.token; guardar(TOKEN); cargar(); },
      function (e) { msg('m-codigo', e); }, this);
  };
  $('codigo').addEventListener('input', function () { if (this.value.replace(/\D/g, '').length === 6) $('b-codigo').click(); });
  $('b-otro').onclick = function () { ver('p-rfc'); };
  $('b-salir').onclick = function () { google.script.run.clienteSalir(TOKEN); TOKEN = ''; guardar(''); $('rfc').value = ''; ver('p-rfc'); };

  var ESTADO = { Pendiente: 'En proceso', Emitida: 'En proceso', Enviada: 'Factura lista', Rechazada: 'No se pudo facturar' };
  function cargar() {
    ver('p-lista'); $('lista').innerHTML = '<div class="card">Cargando tus facturas…</div>';
    llamar('clienteMisFacturas', [TOKEN], function (r) {
      $('nombre').textContent = r.nombre || r.rfc; $('rfc-vista').textContent = 'RFC ' + r.rfc;
      var n = { p: 0, e: 0 }; r.lista.forEach(function (s) { if (s.estado === 'Enviada') n.e++; else if (s.estado !== 'Rechazada') n.p++; });
      $('resumen').innerHTML = '<div><b>' + r.lista.length + '</b><span>solicitadas</span></div><div><b>' + n.p + '</b><span>en proceso</span></div><div><b>' + n.e + '</b><span>listas</span></div>';
      if (!r.lista.length) { $('lista').innerHTML = '<div class="card vacio">Todavía no has pedido ninguna factura con este RFC.</div>'; return; }
      $('lista').innerHTML = r.lista.map(function (s, i) {
        var f = s.factura;
        return '<div class="card f ' + esc(s.estado) + '"><div class="top"><div><div class="tk">Ticket ' + esc(s.folio) + '</div>' +
          '<div class="meta">Pedida el ' + esc(s.fecha) + (s.enviada && s.estado === 'Enviada' ? ' · enviada el ' + esc(s.enviada) : '') + '</div>' +
          (f && f.serieFolio && f.serieFolio !== 'sí' ? '<div class="meta">Factura ' + esc(f.serieFolio) + (f.total ? ' · $' + esc(Number(f.total).toFixed ? Number(f.total).toFixed(2) : f.total) : '') + '</div>' : '') +
          (s.porDefinir ? '<div class="meta">Pago por definir' + (s.pagada ? ' · pagada ✔' : '') + '</div>' : '') +
          (s.motivo ? '<div class="meta" style="color:#b3261e">Motivo: ' + esc(s.motivo) + '</div>' : '') +
          '</div><span class="chip c-' + esc(s.estado) + '">' + esc(ESTADO[s.estado] || s.estado) + '</span></div>' +
          (f ? '<div class="acc">' + (f.pdf ? '<button data-i="' + i + '" data-t="pdf">⬇️ PDF</button>' : '') +
            (f.xml ? '<button class="sec" data-i="' + i + '" data-t="xml">⬇️ XML</button>' : '') + '</div><div id="d' + i + '"></div>'
            : (s.estado === 'Enviada' ? '<p class="nota" style="margin:8px 0 0">Te la enviamos por correo.</p>' : '')) +
          '</div>';
      }).join('');
      window.LISTA = r.lista;
    }, function (e) { $('lista').innerHTML = '<div class="msg err">' + esc(e) + '</div>'; });
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button[data-t]') : null; if (!b) return;
    var s = window.LISTA[Number(b.dataset.i)], d = $('d' + b.dataset.i);
    llamar('clienteDescargar', [TOKEN, s.id, b.dataset.t], function (r) {
      var bin = atob(r.base64), arr = new Uint8Array(bin.length);
      for (var j = 0; j < bin.length; j++) arr[j] = bin.charCodeAt(j);
      var url = URL.createObjectURL(new Blob([arr], { type: r.tipo }));
      var a = document.createElement('a'); a.href = url; a.download = r.nombre; document.body.appendChild(a); a.click(); a.remove();
      d.innerHTML = '<p class="nota">Si no se descargó sola: <a href="' + url + '" download="' + esc(r.nombre) + '">toca aquí</a> · <a href="' + url + '" target="_blank">abrir</a></p>';
    }, function (e) { d.innerHTML = '<div class="msg err">' + esc(e) + '</div>'; }, b);
  });

  TOKEN = leer();
  if (TOKEN) cargar(); else ver('p-rfc');
</script>
</body>
</html>
