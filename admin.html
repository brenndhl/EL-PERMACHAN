<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel El Permachan</title>
<meta name="theme-color" content="#b26a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel EP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="icon" href="admin-192.png">
<link rel="apple-touch-icon" href="admin-180.png">
<style>
  html, body { margin:0; height:100%; background:#f4f5f6; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#111; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  .caja { max-width:420px; margin:12vh auto 0; background:#fff; border-radius:14px; padding:22px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .caja img { width:72px; border-radius:16px; }
  input { width:100%; box-sizing:border-box; font-size:17px; padding:12px; border:1px solid #999; border-radius:10px; margin:10px 0; }
  button { width:100%; padding:14px; font-size:17px; font-weight:700; border:0; border-radius:10px; background:#b26a00; color:#fff; }
  small { color:#666; }
</style>
</head>
<body>
<div id="pedir" class="caja" style="display:none">
  <img src="admin-192.png" alt="">
  <h2>Panel de administración</h2>
  <p>Pega tu enlace del panel (o solo la clave) una vez. Se guarda únicamente en este móvil.</p>
  <input id="clave" placeholder="https://script.google.com/…/exec?k=…" autocomplete="off">
  <button id="guardar">Entrar</button>
  <p><small>¿Cambiaste la clave? Abre esta página con #salir al final y vuelve a pegarla.</small></p>
</div>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbwhM2HebJoKMAueXn66luLed3XVVpFsgMWfH0P0aHFUUmvXursfEnXYI1NbM2L0etX3/exec';
  function leer() { try { return localStorage.getItem('ep_clave') || ''; } catch (e) { return ''; } }
  function guardar(k) { try { localStorage.setItem('ep_clave', k); } catch (e) {} }
  function extraer(t) { var m = /[?&#]k=([A-Za-z0-9]+)/.exec(t) || /^([A-Za-z0-9]{20,})$/.exec(String(t).trim()); return m ? m[1] : ''; }
  if (location.hash === '#salir') { try { localStorage.removeItem('ep_clave'); } catch (e) {} history.replaceState(null, '', location.pathname); }
  var deHash = extraer(location.hash);
  if (deHash) { guardar(deHash); history.replaceState(null, '', location.pathname); }
  function abrir(k) {
    var f = document.createElement('iframe');
    f.title = 'Panel'; f.src = EXEC + '?k=' + encodeURIComponent(k);
    document.body.appendChild(f);
  }
  var k = leer();
  if (k) abrir(k);
  else {
    document.getElementById('pedir').style.display = 'block';
    document.getElementById('guardar').onclick = function () {
      var c = extraer(document.getElementById('clave').value);
      if (!c) { alert('No reconozco la clave. Pega el enlace completo del panel.'); return; }
      guardar(c); document.getElementById('pedir').style.display = 'none'; abrir(c);
    };
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register("sw-admin.js", { scope: "./admin" });
</script>
</body>
</html>
