<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --c:#141110; --ok:#1e6b3a; --no:#b3261e; --gris:#667; --madera:#a8774a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#f4f5f6; color:#111; font-size:16px; line-height:1.4; }
  header { border-bottom:3px solid var(--madera); background:var(--c); color:#fff; padding:14px 16px; font-size:19px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:15px; cursor:pointer; }
  main { max-width:900px; margin:0 auto; padding:14px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi { background:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .kpi .n { font-size:28px; font-weight:800; }
  .kpi .t { font-size:13px; color:var(--gris); }
  .kpi.alerta .n { color:var(--no); }
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  .tab { flex:0 0 auto; border:1px solid #c9d1d4; background:#fff; border-radius:999px; padding:8px 14px; font-size:15px; cursor:pointer; }
  .tab.on { background:var(--c); color:#f3ead6; border-color:var(--c); }
  .tab b { margin-left:4px; }
  input[type=search] { width:100%; padding:12px 14px; font-size:16px; border:1px solid #c9d1d4; border-radius:10px; margin-bottom:12px; }
  .card { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; cursor:pointer; }
  .nom { font-weight:700; }
  .meta { font-size:14px; color:var(--gris); }
  .badge { flex:0 0 auto; font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; }
  .b-Pendiente { background:#fff2cc; color:#7a5b00; } .b-Emitida { background:#cfe2f3; color:#1c4f7a; }
  .b-Enviada { background:#d9ead3; color:#1e6b3a; } .b-Rechazada { background:#f4cccc; color:#8a1c14; }
  .tarde { color:var(--no); font-weight:700; }
  .det { display:none; border-top:1px solid #eee; margin-top:10px; padding-top:10px; font-size:15px; }
  .card.abierta .det { display:block; }
  .fila { margin:3px 0; } .fila b { display:inline-block; min-width:120px; }
  .acc { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .acc button, .ver { border:0; border-radius:9px; padding:10px 14px; font-size:15px; font-weight:600; cursor:pointer; }
  .x-ok { background:var(--ok); color:#fff; } .x-em { background:#1c4f7a; color:#fff; } .x-no { background:var(--no); color:#fff; }
  .x-re, .ver { background:#e3e8ea; color:var(--c); }
  button:disabled { opacity:.6; }
  textarea { width:100%; font-size:15px; padding:10px; border:1px solid #999; border-radius:8px; min-height:70px; margin-top:8px; }
  .aviso { padding:12px; border-radius:10px; margin:8px 0; }
  .aviso.ok { background:#e5f4ea; color:var(--ok); } .aviso.no { background:#fde8e7; color:var(--no); }
  .vacio { text-align:center; padding:30px 10px; color:var(--gris); }
  a { color:var(--c); }
  .filtros { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .filtros select, .filtros input[type=date] { padding:9px 10px; font-size:15px; border:1px solid #c9d1d4; border-radius:8px; background:#fff; max-width:100%; }
  .filtros label { font-size:15px; display:flex; gap:6px; align-items:center; }
  .filtros .limpiar { border:0; background:none; color:var(--c); text-decoration:underline; font-size:14px; cursor:pointer; }
  .pago { font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .chips { flex:0 0 auto; max-width:46%; display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
  .badge { white-space:nowrap; }
  .p-cobrar { background:#ffe0b2; color:#8a4b00; } .p-pagada { background:#d9ead3; color:#1e6b3a; }
  .x-pago { background:#b26a00; color:#fff; }
  .secs { display:flex; flex-wrap:wrap; gap:6px; background:#2a2421; padding:8px 10px; position:sticky; top:0; z-index:4; }
  .secs .seg { flex:1 1 auto; text-align:center; }
  .seg { flex:0 0 auto; border:0; background:none; color:#cbbfa8; font-size:15px; font-weight:700; padding:8px 12px; border-radius:9px; cursor:pointer; }
  .seg.on { background:var(--madera); color:#fff; }
  .seg .nb { background:var(--no); color:#fff; border-radius:999px; font-size:11px; padding:1px 6px; margin-left:4px; }
  .seccion { display:none; } .seccion.on { display:block; }
  .form label { display:block; font-size:13px; font-weight:700; color:var(--gris); margin:8px 0 3px; }
  .form input, .form select, .form textarea { width:100%; padding:10px; font-size:15px; border:1px solid #c9d1d4; border-radius:8px; background:#fff; }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .estrellas { color:#e0a800; letter-spacing:1px; }
  table.ped { width:100%; border-collapse:collapse; font-size:14px; } table.ped td, table.ped th { border-bottom:1px solid #eee; padding:7px 4px; text-align:left; vertical-align:top; }
</style>
</head>
<body>
<header><span style="display:flex;align-items:center;gap:10px"><img src="https://brenndhl.github.io/EL-PERMACHAN/logo-256.png" alt="" style="width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px var(--madera)">Panel de facturas</span><button id="recargar">↻ Actualizar</button></header>
<nav class="secs" id="secs">
  <button class="seg on" data-s="facturas">🧾 Facturas</button>
  <button class="seg" data-s="clientes">👥 Clientes</button>
  <button class="seg" data-s="coment">💬 Opiniones<span class="nb" id="nb-coment" style="display:none"></span></button>
  <button class="seg seg-prov" data-s="prov" data-pp="pagos" style="display:none">💸 Pagos<span class="nb" id="nb-pagos" style="display:none"></span></button>
  <button class="seg seg-prov" data-s="prov" data-pp="pedidos" style="display:none">📦 Pedidos<span class="nb" id="nb-pedidos" style="display:none"></span></button>
  <button class="seg seg-prov" data-s="prov" data-pp="cortes" style="display:none">🧮 Cortes</button>
  <button class="seg seg-prov" data-s="prov" data-pp="cajeras" style="display:none">👩 Cajeras</button>
</nav>
<main>
<div class="seccion on" id="s-facturas">
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <div class="filtros">
    <select id="f-periodo">
      <option value="">Todas las fechas</option><option value="mes">Este mes</option><option value="pasado">Mes pasado</option>
      <option value="30">Últimos 30 días</option><option value="rango">Elegir fechas…</option>
    </select>
    <input type="date" id="f-desde" style="display:none"><input type="date" id="f-hasta" style="display:none">
    <select id="f-pago"><option value="">Todas las formas de pago</option></select>
    <input id="f-cliente" list="dl-clientes" placeholder="🔍 Cliente (escribe nombre o RFC)" style="padding:9px 10px;font-size:15px;border:1px solid #c9d1d4;border-radius:8px;min-width:240px;flex:1">
    <datalist id="dl-clientes"></datalist>
    <label><input type="checkbox" id="f-cobrar"> Solo por cobrar</label>
    <button class="limpiar" id="f-limpiar">Quitar filtros</button>
  </div>
  <input type="search" id="q" placeholder="Buscar por nombre, RFC, folio, correo o ID…">
  <div id="info" class="meta" style="margin-bottom:8px"></div>
  <div id="lista"><div class="card">Cargando…</div></div>
</div>

<div class="seccion" id="s-clientes">
  <div style="display:flex;gap:8px;margin-bottom:10px"><input type="search" id="qc" placeholder="Buscar cliente por nombre, RFC o correo…" style="margin:0">
    <button class="x-ok" id="b-nuevo-cli" style="border:0;border-radius:10px;padding:0 14px;font-weight:700;white-space:nowrap">＋ Nuevo</button></div>
  <div class="meta" style="margin-bottom:8px">Si el cliente ya ha facturado con nosotros <b>no hace falta pedirle la constancia</b>: solo a clientes nuevos (así no se llena el Drive). Cada 6 meses se le recuerda que la actualice desde su área.</div>
  <div id="cli-form"></div>
  <div id="cli-lista"><div class="card">Cargando…</div></div>
</div>

<div class="seccion" id="s-coment">
  <div id="com-lista"><div class="card">Cargando…</div></div>
</div>

<div class="seccion" id="s-prov">
  <div class="acc" style="margin:0 0 10px"><button class="x-ok" id="nv-pago">＋ Pago</button><button class="x-em" id="nv-pedido">＋ Pedido</button><button class="x-re" id="nv-corte">＋ Corte</button></div>
  <div id="nv-form"></div>
  <div id="prov-lista"><div class="card">Cargando…</div></div>
</div>
</main>
<script>
  var K = <?= clave ?>, DUENA = <?= esDuena_(clave) ?>;
  var EST = { estado: 'Pendiente', texto: '' }, DATOS = null, timer = null;
  function mxn(x) { return '$' + Number(x || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN'; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  function cargar() {
    $('lista').innerHTML = '<div class="card">Cargando…</div>';
    google.script.run.withSuccessHandler(pintar).withFailureHandler(function (e) {
      $('lista').innerHTML = '<div class="aviso no">No se pudo cargar. ' + esc(e && e.message) + '</div>';
    }).panelDatos(K, EST);
  }

  function pintar(r) {
    if (!r || r.ok === false) { $('lista').innerHTML = '<div class="aviso no">' + esc(r && r.error) + '</div>'; return; }
    DATOS = r;
    llenarCombos(r);
    var c = r.conteos, k = r.kpi;
    $('kpis').innerHTML =
      kpi(c.Pendiente, 'Pendientes', false) + kpi(k.atrasadas, 'Pendientes con 2+ días', k.atrasadas > 0) +
      kpi(k.enviadasMes, 'Enviadas/emitidas este mes', false) + kpi(k.mes, 'Solicitudes este mes', false) +
      kpi(k.porCobrar, 'Por definir sin pagar', k.porCobrar > 0) +
      kpi(k.clientesRevisar, 'Clientes por revisar', false) +
      '<div class="kpi" id="k-app" style="cursor:pointer"><div class="n">' + (k.appClientes || 0) + ' <span style="font-size:15px;font-weight:600;color:var(--gris)">/ ' + (k.appMoviles || 0) + ' móviles</span></div>' +
      '<div class="t">📲 Clientes con la app (' + (k.appInstaladas || 0) + ' instaladas) · ver lista</div></div>';
    $('k-app').onclick = verUsoApp;
    $('tabs').innerHTML = ['Pendiente', 'Emitida', 'Enviada', 'Rechazada', 'Todas'].map(function (e) {
      var n = e === 'Pendiente' ? 'Pendientes' : e === 'Todas' ? 'Todas' : e + 's';
      return '<button class="tab' + (r.estado === e ? ' on' : '') + '" data-e="' + e + '">' + n + '<b>' + (c[e] || 0) + '</b></button>';
    }).join('');
    $('info').textContent = r.total > r.lista.length ? 'Mostrando ' + r.lista.length + ' de ' + r.total + ' (usa el buscador para afinar)' :
      r.total + ' resultado' + (r.total === 1 ? '' : 's') + (r.estado === 'Pendiente' ? ' · más antiguas primero' : ' · más recientes primero');
    if (!r.lista.length) { $('lista').innerHTML = '<div class="card vacio">' + (r.estado === 'Pendiente' && !EST.texto ? '🎉 No hay facturas pendientes.' : 'Sin resultados.') + '</div>'; return; }
    $('lista').innerHTML = r.lista.map(tarjeta).join('');
  }

  function kpi(n, t, alerta) { return '<div class="kpi' + (alerta ? ' alerta' : '') + '"><div class="n">' + (n || 0) + '</div><div class="t">' + t + '</div></div>'; }

  function tarjeta(s, i) {
    var dias = s.dias == null ? '' : s.dias === 0 ? 'hoy' : 'hace ' + s.dias + ' día' + (s.dias === 1 ? '' : 's');
    var tarde = s.estado === 'Pendiente' && s.dias >= 2;
    var h = '<div class="card" id="c' + i + '"><div class="top" data-abrir="' + i + '"><div>' +
      '<div class="nom">' + esc(s.nombre || s.rfc || '(sin nombre)') + '</div>' +
      '<div class="meta">' + esc(s.id) + ' · ticket ' + esc(s.folio || '—') + ' · ' + esc(s.fecha) +
      (dias ? ' · <span class="' + (tarde ? 'tarde' : '') + '">' + dias + '</span>' : '') + '</div></div>' +
      '<span class="chips"><span class="badge b-' + esc(s.estado) + '">' + esc(s.estado || '—') + '</span>' +
      (s.factura ? '<span class="pago p-pagada">🧾 Factura subida</span>' : '') + (s.porDefinir ? (s.pagada ? '<span class="pago p-pagada">💰 Pagada ' + esc(s.fechaPago) + '</span>' + (s.complemento ? '<span class="pago p-pagada">📎 Complemento</span>' : '<span class="pago p-cobrar">⏳ Falta complemento</span>') : '<span class="pago p-cobrar">💰 Por cobrar</span>') : '') +
      '</span></div>' +
      '<div class="det">' +
      fila('RFC', s.rfc) + fila('Correo', s.email) + fila('Forma de pago', s.pago) + fila('Uso CFDI', s.uso) +
      fila('Origen', s.origen) + (s.fechaEmitida ? fila('Emitida/enviada', s.fechaEmitida) : '') +
      (s.estado !== 'Pendiente' ? fila('Último cambio', s.fechaEstado) : '') +
      (s.comentario ? fila('Comentario', s.comentario) : '') + (s.notas ? fila('Notas / motivo', s.notas) : '') +
      '<div class="acc">' +
      (s.foto ? '<button class="ver" data-ver="' + i + '" data-c="foto">📷 Ticket</button>' : '') +
      (s.constancia ? '<button class="ver" data-ver="' + i + '" data-c="constancia">📄 Constancia</button>' : '') +
      (s.factura ? '<button class="ver" data-ver="' + i + '" data-c="fpdf">🧾 Factura PDF</button><button class="ver" data-ver="' + i + '" data-c="fxml">🧾 XML</button>' : '') +
      '</div><div class="visor" id="v' + i + '"></div>' +
      '<div class="acc">' + acciones(s, i) + '</div><div id="r' + i + '"></div></div></div>';
    return h;
  }
  function fila(k, v) { return '<div class="fila"><b>' + k + ':</b> ' + esc(v || '—') + '</div>'; }
  function acciones(s, i) {
    var b = [];
    if (s.estado !== 'Enviada') b.push('<button class="x-ok" data-i="' + i + '" data-a="Enviada">✅ Enviada</button>');
    if (s.estado !== 'Emitida' && s.estado !== 'Enviada') b.push('<button class="x-em" data-i="' + i + '" data-a="Emitida">📄 Emitida</button>');
    if (s.estado !== 'Rechazada') b.push('<button class="x-no" data-i="' + i + '" data-a="Rechazada">❌ Rechazar</button>');
    if (s.estado !== 'Pendiente') b.push('<button class="x-re" data-i="' + i + '" data-a="Pendiente">↩️ Volver a pendiente</button>');
    if (s.porDefinir && !s.pagada) b.push('<button class="x-pago" data-i="' + i + '" data-a="Pagada">💰 Marcar pagada</button>');
    if (s.pagada) b.push('<button class="x-re" data-i="' + i + '" data-a="QuitarPagada">↩️ Quitar pagada</button>');
    return b.join('');
  }

  function cambiar(i, estado, btn) {
    var s = DATOS.lista[i], r = $('r' + i);
    if (estado === 'Pagada') return marcarPagada(i, btn);
    if (estado === 'QuitarPagada') {
      if (!confirm('¿Quitar la marca de pagada de ' + s.id + '? (no se manda correo)')) return;
      return llamar(btn, r, 'panelQuitarPagada', [K, s.id], 'Quitada la marca de pagada.');
    }
    if (estado === 'Rechazada' && !$('m' + i)) {
      r.innerHTML = '<textarea id="m' + i + '" placeholder="Motivo (le llega al cliente): ticket de otro mes, falta constancia, RFC no coincide…"></textarea>' +
        '<div class="acc"><button class="x-no" data-i="' + i + '" data-a="Rechazada">Confirmar rechazo y avisar</button></div>';
      return;
    }
    var aviso = estado === 'Pendiente' ? '¿Volver a poner ' + s.id + ' como pendiente? (al cliente no se le avisa)' :
      estado === 'Rechazada' ? null : '¿Marcar ' + s.id + ' como ' + estado + '? Al cliente le llega un correo.';
    if (aviso && !confirm(aviso)) return;
    var motivo = $('m' + i) ? $('m' + i).value : '';
    btn.disabled = true; var t = btn.textContent; btn.textContent = 'Guardando…';
    google.script.run.withSuccessHandler(function (res) {
      if (!res || res.ok === false) { btn.disabled = false; btn.textContent = t; r.innerHTML = '<div class="aviso no">' + esc(res && res.error) + '</div>'; return; }
      r.innerHTML = '<div class="aviso ok">Hecho: ' + esc(s.id) + ' ahora está como <b>' + esc(estado) + '</b>.</div>';
      setTimeout(cargar, 1200);
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = t; r.innerHTML = '<div class="aviso no">Error: ' + esc(e && e.message) + '</div>';
    }).panelCambiarEstado(K, s.id, estado, motivo);
  }

  function marcarPagada(i, btn) {
    var s = DATOS.lista[i], r = $('r' + i);
    if (!$('fp' + i)) {
      r.innerHTML = '<div class="fila" style="margin-top:8px"><b>Fecha de pago:</b> <input type="date" id="fp' + i + '" value="' + DATOS.hoy + '"></div>' +
        '<div class="fila"><b>Forma de pago:</b> <select id="fo' + i + '"><option>Transferencia</option><option>Efectivo</option><option>Tarjeta</option><option>Cheque</option></select></div>' +
        '<textarea id="np' + i + '" placeholder="Nota para la contadora (opcional): referencia, banco…"></textarea>' +
        '<div class="acc"><button class="x-pago" data-i="' + i + '" data-a="Pagada">Confirmar pago y pedir el complemento</button></div>';
      return;
    }
    llamar(btn, r, 'panelMarcarPagada', [K, s.id, $('fp' + i).value, $('np' + i).value, $('fo' + i).value],
      'Marcada como pagada. Complemento de pago pedido a ' + DATOS.correoContadora + '.');
  }
  function llamar(btn, r, fn, args, okTxt) {
    btn.disabled = true; var t = btn.textContent; btn.textContent = 'Guardando…';
    var run = google.script.run.withSuccessHandler(function (res) {
      if (!res || res.ok === false) { btn.disabled = false; btn.textContent = t; r.innerHTML = '<div class="aviso no">' + esc(res && res.error) + '</div>'; return; }
      r.innerHTML = '<div class="aviso ok">' + esc(res.avisado === false ? 'Guardado, pero el correo no se pudo enviar.' : okTxt) + '</div>';
      setTimeout(cargar, 1200);
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = t; r.innerHTML = '<div class="aviso no">Error: ' + esc(e && e.message) + '</div>';
    });
    run[fn].apply(run, args);
  }

  // ---- Filtros ----
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function leerFiltros() {
    var p = $('f-periodo').value, h = new Date(), d = '', a = '';
    if (p === 'mes') { d = ymd(new Date(h.getFullYear(), h.getMonth(), 1)); }
    else if (p === 'pasado') { d = ymd(new Date(h.getFullYear(), h.getMonth() - 1, 1)); a = ymd(new Date(h.getFullYear(), h.getMonth(), 0)); }
    else if (p === '30') { d = ymd(new Date(h.getTime() - 29 * 86400000)); }
    else if (p === 'rango') { d = $('f-desde').value; a = $('f-hasta').value; }
    $('f-desde').style.display = $('f-hasta').style.display = p === 'rango' ? '' : 'none';
    EST.desde = d; EST.hasta = a; EST.pago = $('f-pago').value; EST.cliente = rfcDeFiltro($('f-cliente').value); EST.porCobrar = $('f-cobrar').checked;
  }
  function rfcDeFiltro(t) {
    t = String(t || '').trim().toUpperCase(); if (!t) return '';
    var m = /\(([A-ZÑ&0-9]{12,13})\)\s*$/.exec(t); if (m) return m[1];
    if (/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(t)) return t;
    var c = (DATOS && DATOS.clientes || []).filter(function (x) { return String(x[1]).toUpperCase().indexOf(t) >= 0; });
    return c.length === 1 ? c[0][0] : '';
  }
  var combosListos = false;
  function llenarCombos(r) {
    if (combosListos) return; combosListos = true;
    $('f-pago').innerHTML += (r.formasPago || []).map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + '</option>'; }).join('');
    $('dl-clientes').innerHTML = (r.clientes || []).map(function (c) { return '<option value="' + esc(c[1] + ' (' + c[0] + ')') + '">'; }).join('');
  }
  ['f-periodo', 'f-desde', 'f-hasta', 'f-pago', 'f-cliente', 'f-cobrar'].forEach(function (id) {
    $(id).addEventListener('change', function () { leerFiltros(); if (id === 'f-cobrar' && EST.porCobrar) EST.estado = 'Todas'; if (id !== 'f-periodo' || $('f-periodo').value !== 'rango') cargar(); });
  });
  $('f-limpiar').onclick = function () {
    $('f-periodo').value = ''; $('f-pago').value = ''; $('f-cliente').value = ''; $('f-cobrar').checked = false; $('q').value = '';

          return '<div class="card"><div class="nom">🚚 ' + esc(g) + '</div><table class="ped">' + grupos[g].map(function (p) {
            return '<tr><td style="width:28px"><input type="checkbox" class="ck-ped" value="' + esc(p.id) + '"' + (DUENA ? '' : ' disabled') + '></td><td><b>' + esc(p.producto) + '</b>' +
              (p.notas ? '<div class="meta">' + esc(p.notas) + '</div>' : '') + '</td><td>' + esc(p.cantidad) + '</td><td class="meta">' + esc(p.fecha) + (p.por ? '<br>' + esc(p.por) : '') + '</td></tr>';
          }).join('') + '</table></div>';
        }).join('') + (pe.length && DUENA ? '<button class="x-ok" id="b-pedidos" style="width:100%;padding:14px;border:0;border-radius:10px;font-weight:700">✅ Marcar seleccionados como pedidos</button><div id="r-ped"></div>' : '') +
        (pe.length ? '' : '<div class="card vacio">No hay nada por pedir. 🎉</div>') +
        (camino.length ? '<div class="card"><div class="nom">🚚 Pedidos, en camino (' + camino.length + ')</div><table class="ped">' + camino.map(function (p) {
          return '<tr><td><b>' + esc(p.producto) + '</b><div class="meta">' + esc(p.proveedor || '') + ' · pedido ' + esc(p.pedido) + '</div></td><td>' + esc(p.cantidad) + '</td><td><button class="x-ok" data-llego="' + esc(p.id) + '" style="border:0;border-radius:8px;padding:7px 10px;font-weight:700">✅ Llegó</button></td></tr>'; }).join('') + '</table><div class="meta">La cajera también puede marcar «Ya llegó» desde su móvil.</div></div>' : '') +
        (he.length ? '<div class="card"><div class="nom">✔ Recibidos (recientes)</div><table class="ped">' + he.map(function (p) {
          return '<tr><td>' + esc(p.producto) + '</td><td>' + esc(p.cantidad) + '</td><td class="meta">' + esc(p.proveedor) + '</td><td class="meta">llegó ' + esc(p.recibido) + (p.recibidoPor ? '<br>' + esc(p.recibidoPor) : '') + '</td></tr>'; }).join('') + '</table></div>' : '');
      if ($('b-pedidos')) $('b-pedidos').onclick = function () {
        var ids = Array.prototype.map.call(document.querySelectorAll('.ck-ped:checked'), function (c) { return c.value; });
        if (!ids.length) { $('r-ped').innerHTML = '<div class="aviso no">Marca al menos un producto.</div>'; return; }
        this.disabled = true;
        run('panelPedidosHechos', [K, ids], function (r) { $('r-ped').innerHTML = '<div class="aviso ok">' + r.n + ' marcados como pedidos.</div>'; setTimeout(cargarProv, 900); }, $('r-ped'));
      };
    }
  }
  $('prov-lista').addEventListener('click', function (ev) {
    var ll = ev.target.closest('[data-llego]');
    if (ll) { ll.disabled = true; run('cajaRecibido', [K, [ll.dataset.llego], ''], function () { cargarProv(); }, null); return; }
    var cf = ev.target.closest('[data-cfoto]');
    if (cf) { ev.preventDefault(); run('cajaCorteFoto', [K, cf.dataset.cfoto], function (r) { abrirArchivo(r, $('cfoto-v')); }, $('cfoto-v')); return; }
    var a = ev.target.closest('button[data-arch]');
    if (a) { var p = CAJA.pagos[Number(a.dataset.arch)]; run('cajaArchivo', [K, p.id, a.dataset.c], function (r) { abrirArchivo(r, $('pp' + a.dataset.arch)); }, $('pp' + a.dataset.arch)); return; }
    var b = ev.target.closest('button[data-pagar]'); if (!b) return;
    var i = Number(b.dataset.pagar), p = CAJA.pagos[i], cont = $('pp' + i);
    if (!$('cp' + i)) {
      cont.innerHTML = '<div class="form" style="margin-top:8px"><label>Comprobante de pago (foto o PDF)</label><input type="file" id="cp' + i + '" accept="image/*,application/pdf">' +
        (p.correo ? '<label style="display:flex;gap:6px;align-items:center;font-weight:600;color:#111"><input type="checkbox" id="av' + i + '" checked style="width:auto"> Enviárselo a ' + esc(p.correo) + '</label>' : '<div class="meta">Sin correo del proveedor: solo se guardará.</div>') +
        '<div class="acc"><button class="x-ok" data-pagar="' + i + '">Confirmar pago</button></div><div id="rp' + i + '"></div></div>';
      return;
    }
    b.disabled = true;
    leerArchivo($('cp' + i), function (arch) {
      run('panelPagoHecho', [K, p.id, arch, $('av' + i) ? $('av' + i).checked : false], function (r) {
        $('rp' + i).innerHTML = '<div class="aviso ok">Pago marcado' + (r.aviso ? '. ' + esc(r.aviso) : '') + '.</div>'; setTimeout(cargarProv, 1200);
      }, $('rp' + i));
    });
  });

  if (!DUENA) $('secs').insertAdjacentHTML('beforeend', '<span style="color:#cbbfa8;font-size:12px;width:100%;text-align:center">Acceso de contadora · Pagos y pedidos solo lo ve la administradora</span>');
  function pintarCajeras() {
    $('prov-lista').innerHTML = '<div class="card">Cargando…</div>';
    run('panelCajeras', [K], function (r) {
      $('prov-lista').innerHTML = '<div class="card form"><b>Nueva cajera</b><div class="dos" style="grid-template-columns:2fr 2fr 1fr"><input id="cj-nom" placeholder="Nombre"><input id="cj-mail" type="email" placeholder="Correo (aviso de las 5)">' +
        '<button class="x-ok" id="cj-add" style="border:0;border-radius:9px;font-weight:700">＋ Dar de alta</button></div><div class="meta" style="margin-top:6px">Se le crea un código de 4 cifras. Ella lo escribe una vez en su móvil (en la app de caja).</div><div id="cj-r"></div></div>' +
        (r.cajeras.length ? r.cajeras.map(function (c) {
          return '<div class="card"><div class="top"><div><div class="nom">👩 ' + esc(c.nombre) + ' · código <span style="letter-spacing:2px">' + esc(c.codigo) + '</span></div>' +
            '<div class="meta">' + (c.correo ? '✉️ ' + esc(c.correo) + '<br>' : '✉️ sin correo (no le llega el aviso de las 5)<br>') + 'Últimos 30 días: ' + c.pagos + ' pagos pedidos · ' + c.pedidos + ' pedidos · ' + c.recibidos + ' recibidos · ' + c.cortes + ' cortes · ' + c.entradas + ' entradas<br>Último uso: ' + esc(c.ultimo || 'nunca') + ' · alta ' + esc(c.alta) + '</div></div>' +
            '<span class="badge ' + (c.activa ? 'b-Enviada">Activa' : 'b-Rechazada">Sin acceso') + '</span></div>' +
            '<div class="acc"><button class="x-re" data-cjmail="' + esc(c.codigo) + '" data-nom="' + esc(c.nombre) + '" data-mail="' + esc(c.correo) + '">✉️ Correo</button><button class="' + (c.activa ? 'x-no' : 'x-ok') + '" data-cj="' + esc(c.codigo) + '" data-nom="' + esc(c.nombre) + '" data-act="' + (c.activa ? '0' : '1') + '">' + (c.activa ? 'Quitar acceso' : 'Devolver acceso') + '</button></div></div>';
        }).join('') : '<div class="card vacio">Todavía no hay cajeras. Da de alta la primera arriba.</div>') +
        '<div class="card"><div class="nom">Actividad reciente</div>' + (r.actividad.length ? '<table class="ped">' + r.actividad.map(function (a) {
          return '<tr><td class="meta" style="white-space:nowrap">' + esc(a.fecha) + '</td><td><b>' + esc(a.cajera) + '</b></td><td>' + esc(a.accion) + '<div class="meta">' + esc(a.detalle) + '</div></td></tr>'; }).join('') + '</table>' : '<div class="meta">Sin actividad todavía.</div>') + '</div>';
      $('cj-add').onclick = function () { run('panelCajeraGuardar', [K, { nombre: $('cj-nom').value, correo: $('cj-mail').value }], function (x) { alert(x.mensaje); pintarCajeras(); }, $('cj-r')); };
    }, $('prov-lista'));
  }
  $('prov-lista').addEventListener('click', function (ev) {
    var m = ev.target.closest('button[data-cjmail]');
    if (m) { var mail = prompt('Correo de ' + m.dataset.nom + ' (le llega el aviso del corte a las 5):', m.dataset.mail || ''); if (mail === null) return;
      run('panelCajeraGuardar', [K, { codigo: m.dataset.cjmail, nombre: m.dataset.nom, correo: mail }], function () { pintarCajeras(); }, null); return; }
    var b = ev.target.closest('button[data-cj]'); if (!b) return;
    if (b.dataset.act === '0' && !confirm('¿Quitar el acceso a ' + b.dataset.nom + '? Su código dejará de funcionar.')) return;
    run('panelCajeraGuardar', [K, { codigo: b.dataset.cj, nombre: b.dataset.nom, activa: b.dataset.act === '1' }], function () { pintarCajeras(); }, null);
  });
  function provs() { return (CAJA && CAJA.proveedores || []).map(function (x) { return '<option value="' + esc(x[0]) + '">'; }).join(''); }
  $('nv-pago').onclick = function () {
    $('nv-form').innerHTML = '<div class="card form"><b>Nuevo pago a proveedor</b><label>Proveedor</label><input id="np-prov" list="dl-np"><datalist id="dl-np">' + provs() + '</datalist>' +
      '<label>Correo del proveedor</label><input id="np-correo" type="email"><div class="dos"><div><label>Importe ($)</label><input id="np-imp" inputmode="decimal"></div>' +
      '<div><label>Pagar antes del</label><input id="np-lim" type="date"></div></div><label>Concepto</label><input id="np-con"><label>Estado</label><select id="np-est"><option value="Pendiente">Pendiente de pagar</option><option value="Pagado">Ya está pagado</option></select><label>Factura o nota (opcional)</label><input id="np-adj" type="file" accept="image/*,application/pdf">' +
      '<div class="acc"><button class="x-ok" id="np-ok">Guardar pago</button><button class="x-re" onclick="document.getElementById(\'nv-form\').innerHTML=\'\'">Cancelar</button></div><div id="np-r"></div></div>';
    $('np-prov').onchange = function () { var x = (CAJA.proveedores || []).filter(function (p) { return p[0] === $('np-prov').value; })[0]; if (x && x[1] && !$('np-correo').value) $('np-correo').value = x[1]; };
    $('np-ok').onclick = function () {
      var b = this; b.disabled = true;
      leerArchivo($('np-adj'), function (adj) {
        run('cajaNuevoPago', [K, { proveedor: $('np-prov').value, correo: $('np-correo').value, importe: $('np-imp').value, limite: $('np-lim').value, concepto: $('np-con').value, adjunto: adj, estado: $('np-est').value }],
          function (r) { $('nv-form').innerHTML = '<div class="aviso ok">Pago ' + esc(r.id) + ' guardado.</div>'; PV = 'pagos'; cargarProv(); }, $('np-r'));
        setTimeout(function () { b.disabled = false; }, 1500);
      });
    };
  };
  $('nv-pedido').onclick = function () {
    var fila = function () { return '<div class="dos" style="grid-template-columns:2fr 1fr;margin-top:6px"><input class="it-p" placeholder="Producto"><input class="it-c" placeholder="Cantidad"></div>'; };
    $('nv-form').innerHTML = '<div class="card form"><b>Nuevo pedido</b><label>Proveedor (opcional)</label><input id="nd-prov" list="dl-nd"><datalist id="dl-nd">' + provs() + '</datalist>' +
      '<label>Productos</label><div id="nd-items">' + fila() + fila() + fila() + '</div><button class="x-re" id="nd-mas" style="margin-top:6px">＋ Otro producto</button>' +
      '<label>Notas (opcional)</label><input id="nd-notas"><label>Estado</label><select id="nd-est"><option value="Pendiente">Por pedir</option><option value="Pedido">Ya lo pedí (en camino)</option><option value="Recibido">Ya llegó</option></select><div class="acc"><button class="x-ok" id="nd-ok">Guardar pedido</button><button class="x-re" onclick="document.getElementById(\'nv-form\').innerHTML=\'\'">Cancelar</button></div><div id="nd-r"></div></div>';
    $('nd-mas').onclick = function () { $('nd-items').insertAdjacentHTML('beforeend', fila()); };
    $('nd-ok').onclick = function () {
      var items = Array.prototype.map.call($('nd-items').children, function (d) { return { proveedor: $('nd-prov').value, producto: d.querySelector('.it-p').value, cantidad: d.querySelector('.it-c').value, notas: $('nd-notas').value }; })
        .filter(function (x) { return x.producto.trim(); });
      run('cajaNuevoPedido', [K, items, '', $('nd-est').value], function (r) { $('nv-form').innerHTML = '<div class="aviso ok">' + r.n + ' productos añadidos al pedido.</div>'; PV = 'pedidos'; cargarProv(); }, $('nd-r'));
    };
  };
  $('nv-corte').onclick = function () {
    var hoy = DATOS && DATOS.hoy || '';
    $('nv-form').innerHTML = '<div class="card form"><b>Corte del día</b><label>Fecha</label><input id="nc-f" type="date" value="' + esc(hoy) + '">' +
      '<div class="dos"><div><label>Tarjeta débito ($)</label><input id="nc-d" inputmode="decimal"></div><div><label>Tarjeta crédito ($)</label><input id="nc-c" inputmode="decimal"></div></div>' +
      '<label>Notas (opcional)</label><input id="nc-n"><div class="acc"><button class="x-ok" id="nc-ok">Guardar corte</button><button class="x-re" onclick="document.getElementById(\'nv-form\').innerHTML=\'\'">Cancelar</button></div><div id="nc-r"></div></div>';
    $('nc-ok').onclick = function () {
      run('cajaCorte', [K, { fecha: $('nc-f').value, debito: $('nc-d').value, credito: $('nc-c').value, notas: $('nc-n').value }],
        function (r) { $('nv-form').innerHTML = '<div class="aviso ok">Corte guardado: llegan ' + mxn(r.neto) + ' (comisión ' + mxn(r.comision) + ').</div>'; PV = 'cortes'; cargarProv(); }, $('nc-r'));
    };
  };
  if (DUENA) { Array.prototype.forEach.call(document.querySelectorAll('.seg-prov'), function (b) { b.style.display = ''; }); run('cajaDatos', [K], function (r) { CAJA = r; marcarNb(); }, null); }
  run('panelComentarios', [K], function (r) { var nb = $('nb-coment'); nb.style.display = r.nuevos ? '' : 'none'; nb.textContent = r.nuevos; }, null);
  cargar();
</script>
</body>
</html>
